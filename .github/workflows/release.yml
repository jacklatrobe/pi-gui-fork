name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release tag and product versions
        run: node scripts/verify-release-version.mjs --tag "$GITHUB_REF_NAME"

  build-linux:
    needs: release-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package Linux AppImage and deb
        run: |
          cd apps/desktop
          pnpm run build
          node scripts/run-electron-builder.mjs --linux \
            --publish never \
            "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"

      - name: Verify packaged runtime dependencies
        run: pnpm --dir apps/desktop run verify:packaged-runtime-deps:linux

      - name: Verify Linux packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/apps/desktop/release" \
            "${GITHUB_REF_NAME#v}" \
            "$PWD/apps/desktop/release-proof/linux-build"

      - name: Stage validated Linux artifacts
        run: |
          node apps/desktop/scripts/release-artifacts.mjs stage \
            --platform linux \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input apps/desktop/release \
            --output apps/desktop/release-candidate

      - name: Upload immutable Linux candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ github.sha }}
          path: apps/desktop/release-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Linux package proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-proof-${{ github.sha }}
          path: apps/desktop/release-proof/linux-build/
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    needs: release-preflight
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package Windows
        shell: bash
        run: |
          cd apps/desktop
          pnpm run build
          node scripts/package-windows.mjs \
            --win \
            --publish never \
            --config.npmRebuild=false \
            "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"

      - name: Verify packaged runtime dependencies
        run: pnpm --dir apps/desktop run verify:packaged-runtime-deps:windows

      - name: Verify Windows packages and architecture
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-windows-release.ps1 `
            -ReleaseDir "$PWD/apps/desktop/release" `
            -Version "$($env:GITHUB_REF_NAME -replace '^v', '')" `
            -PackagedApp "$PWD/apps/desktop/release/win-unpacked/pi-gui.exe" `
            -SmokePackages

      - name: Stage validated Windows artifacts
        shell: bash
        run: |
          node apps/desktop/scripts/release-artifacts.mjs stage \
            --platform windows \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input apps/desktop/release \
            --output apps/desktop/release-candidate

      - name: Upload immutable Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ github.sha }}
          path: apps/desktop/release-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stage-draft:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download immutable platform candidates
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ github.sha }}
          path: release-candidate
          merge-multiple: true

      - name: Validate combined release candidate
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input release-candidate

      - name: Check existing release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/github-release-state.mjs

      - name: Upload validated draft
        uses: softprops/action-gh-release@v3
        with:
          files: release-candidate/*
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  verify-draft-linux:
    needs: stage-draft
    runs-on: ubuntu-latest
    # GitHub requires push access even to read unpublished draft assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir draft-release

      - name: Verify draft manifests and bytes
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input draft-release

      - name: Verify draft Linux packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/draft-release" \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/draft-linux-proof"

  verify-draft-windows:
    needs: stage-draft
    runs-on: windows-latest
    # GitHub requires push access even to read unpublished draft assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir draft-release

      - name: Verify draft manifests and bytes
        shell: bash
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input draft-release

      - name: Verify draft Windows packages
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-windows-release.ps1 `
            -ReleaseDir "$PWD/draft-release" `
            -Version "$($env:GITHUB_REF_NAME -replace '^v', '')" `
            -SmokePackages

  publish:
    needs:
      - verify-draft-linux
      - verify-draft-windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require the validated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/github-release-state.mjs --require-draft

      - name: Revalidate draft bytes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir final-draft-check
          gh release download "$GITHUB_REF_NAME" --dir final-draft-check
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input final-draft-check

      - name: Publish validated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published-release
          gh release download "$GITHUB_REF_NAME" --dir published-release
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

  verify-published-linux:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir published-release

      - name: Verify published manifests and bytes
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

      - name: Verify published Linux packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/published-release" \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/published-linux-proof"

  verify-published-windows:
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir published-release

      - name: Verify published manifests and bytes
        shell: bash
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

      - name: Verify published Windows packages
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-windows-release.ps1 `
            -ReleaseDir "$PWD/published-release" `
            -Version "$($env:GITHUB_REF_NAME -replace '^v', '')" `
            -SmokePackages
